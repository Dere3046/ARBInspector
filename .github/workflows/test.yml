name: test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build all features
        run: cargo build --all-features

      - name: Run all tests
        run: cargo test --all-features

      - name: Build minimal (inspect only)
        run: cargo build --no-default-features

      - name: Build with sign
        run: cargo build --features sign

      - name: Build with sign+encrypt
        run: cargo build --features "sign encrypt"

      - name: Build release
        run: cargo build --release

      - uses: actions/upload-artifact@v5
        with:
          name: arb_inspector
          path: target/release/arb_inspector

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/arb_inspector
          generate_release_notes: true
